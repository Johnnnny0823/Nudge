name: Deploy Nudge Web Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "web_dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Inject Firebase web API key
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          if [ -z "$FIREBASE_WEB_API_KEY" ]; then
            echo "::warning::未設定 FIREBASE_WEB_API_KEY secret，網頁後台將無法連線 Firebase"
            exit 0
          fi
          sed -i "s/__FIREBASE_WEB_API_KEY__/${FIREBASE_WEB_API_KEY}/g" web_dashboard/assets/app.js web_dashboard/login.html

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
